<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480">
  <defs>
    <style type="text/css"><![CDATA[
      .bond {
        stroke: #222222;
        stroke-width: 2.6;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .dbond {
        stroke: #222222;
        stroke-width: 2.6;
        stroke-linecap: round;
        fill: none;
      }
      .o {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 18px;
        font-weight: 600;
        fill: #e53935;
      }
      .n {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 17px;
        font-weight: 600;
        fill: #1e88e5;
      }
      .c {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 15px;
        font-weight: 500;
        fill: #222222;
      }
    ]]></style>
  </defs>

  <!-- ========== DOPAMINE (haut) - layout proche du PNG ========== -->
  <g id="dopamine">
    <!-- Anneau benzénique (catéchol) légèrement incliné -->
    <path class="bond" d="
      M 142 95
      L 176 76
      L 214 90
      L 224 128
      L 190 148
      L 152 134
      Z"/>

    <!-- Doubles liaisons aromatiques -->
    <path class="dbond" d="M 147 98  L 174 81"/>
    <path class="dbond" d="M 216 95  L 221 124"/>
    <path class="dbond" d="M 187 144 L 156 132"/>

    <!-- Groupe HO supérieur (position 3) -->
    <line class="bond" x1="142" y1="95" x2="120" y2="78"/>
    <text class="o" x="95" y="75">HO</text>

    <!-- Groupe HO inférieur (position 4) -->
    <line class="bond" x1="152" y1="134" x2="132" y2="158"/>
    <text class="o" x="105" y="172">HO</text>

    <!-- Chaîne éthylamine -CH2-CH2-NH2 (vers la droite haut) -->
    <line class="bond" x1="224" y1="128" x2="262" y2="112"/>
    <line class="bond" x1="262" y1="112" x2="300" y2="128"/>
    <line class="bond" x1="300" y1="128" x2="338" y2="112"/>

    <!-- NH2 -->
    <text class="n" x="345" y="116">NH</text>
    <text class="n" x="372" y="108" style="font-size:13px">2</text>
  </g>

  <!-- ========== CAFÉINE (bas) ========== -->
  <g id="caffeine">
    <!-- Cycle à 6 (pyrimidine-dione) -->
    <path class="bond" d="
      M 165 340
      L 205 365
      L 255 350
      L 263 305
      L 222 280
      L 172 295
      Z"/>

    <!-- Double liaison C4=C5 -->
    <path class="dbond" d="M 259 309 L 226 285"/>

    <!-- Carbonyles -->
    <!-- C2=O bas -->
    <line class="bond" x1="205" y1="365" x2="205" y2="395"/>
    <text class="o" x="195" y="413">O</text>

    <!-- C6=O gauche -->
    <line class="bond" x1="172" y1="295" x2="145" y2="275"/>
    <text class="o" x="128" y="270">O</text>

    <!-- Méthyl sur N1 (bas gauche) -->
    <line class="bond" x1="165" y1="340" x2="140" y2="365"/>
    <text class="c" x="112" y="380">H₃C</text>

    <!-- Méthyl sur N3 (bas droite) -->
    <line class="bond" x1="255" y1="350" x2="285" y2="368"/>
    <text class="c" x="290" y="382">CH₃</text>

    <!-- Cycle imidazole à 5 -->
    <path class="bond" d="
      M 222 280
      L 262 252
      L 300 272
      L 292 312
      L 263 305"/>

    <!-- Double liaison dans l'imidazole -->
    <path class="dbond" d="M 300 272 L 292 312"/>

    <!-- Méthyl sur N7 (haut) -->
    <line class="bond" x1="262" y1="252" x2="262" y2="222"/>
    <text class="c" x="245" y="214">CH₃</text>

    <!-- Étiquettes azote en bleu -->
    <text class="n" x="152" y="348">N</text>
    <text class="n" x="242" y="358">N</text>
    <text class="n" x="254" y="250">N</text>
    <text class="n" x="285" y="322">N</text>
  </g>
</svg>
