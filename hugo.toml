# ============================================================
# CONFIGURATION DU SITE HUGO
# ============================================================

baseURL = "https://site-c8s.pages.dev/"
languageCode = "fr-fr"
title = "Tout pour Cpgérer"
enableRobotsTXT = true

[params]
  description = "Des ressources claires et utiles pour réussir en classes préparatoires : fiches de chimie, annales et informatique physico-chimique."
  instagramURL = "https://www.instagram.com/tout_pour_cpgerer/"
  bloggerURL = "https://toutpourcpgerer.blogspot.com/"

# Autorise le HTML dans les fichiers Markdown
[markup.goldmark.renderer]
  unsafe = true

# Publie les PDF placés dans content/ (page bundles)
# → un PDF dans content/chimie/annales/centrale/centrale-pc-2024/x.pdf
#   est servi à /chimie/annales/centrale/centrale-pc-2024/x.pdf
[[module.mounts]]
  source = "static"
  target = "static"

[[module.mounts]]
  source = "content"
  target = "static"
  includeFiles = ["**.pdf", "**.PDF"]

[[module.mounts]]
  source = "content"
  target = "content"
