{{/* Pied de page — liens Instagram / Blogger dans hugo.toml [params] */}}
<footer class="site-footer">
  <div class="container footer-inner">
    <div>
      <strong>Tout pour Cpgérer</strong>
      <p>Des ressources pour avancer sereinement en CPGE.</p>
    </div>
    <div class="footer-links">
      {{ with .Site.Params.bloggerURL }}
        <a href="{{ . }}" target="_blank" rel="noopener">Le blog</a>
      {{ end }}
      {{ with .Site.Params.instagramURL }}
        <a href="{{ . }}" target="_blank" rel="noopener">Instagram</a>
      {{ end }}
      <a href="{{ "index.xml" | relURL }}">Flux RSS</a>
    </div>
    <p class="copyright">© {{ now.Year }} Tout pour Cpgérer</p>
  </div>
</footer>
