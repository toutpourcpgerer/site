{{ define "main" }}
<article class="article">
  <p class="breadcrumbs"><a href="{{ .CurrentSection.RelPermalink }}">← {{ .CurrentSection.Title }}</a></p>
  <p class="section-kicker">TOUT POUR CPGÉRER</p>
  <h1>{{ .Title }}</h1>
  {{ with .Params.summary }}<p class="summary">{{ . }}</p>{{ end }}
  <div class="article-content">{{ .Content }}</div>
  {{ with .Params.pdf }}

<!-- Fichier PDF -->
    <section class="pdf-section"><div class="pdf-heading">
      <div><p class="section-kicker">DOCUMENT À CONSULTER</p>
    <h2>Le document PDF</h2></div>
      <a class="button button-dark" href="{{ . | relURL }}" download>Télécharger le PDF ↓</a></div>
      <iframe class="pdf-viewer" src="{{ . | relURL }}#view=FitH" title="Lecteur PDF : {{ $.Title }}" loading="lazy"></iframe></section>{{ end }}
</article>
{{ end }}
